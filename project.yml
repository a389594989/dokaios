name: DokaiOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DokaiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/luts
        type: folder
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Doka
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 用于取景与拍照，所有处理均在本机完成。
        NSPhotoLibraryAddUsageDescription: 用于把成片保存到系统相册。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dokaios
        TARGETED_DEVICE_FAMILY: "1"
  DokaiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: TestImages
        type: folder
    dependencies:
      - target: DokaiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dokaios.tests
schemes:
  DokaiOS:
    build:
      targets:
        DokaiOS: all
        DokaiOSTests: [test]
    test:
      targets:
        - DokaiOSTests
